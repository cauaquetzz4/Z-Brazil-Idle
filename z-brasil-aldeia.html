<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Z-Brasil: Aldeia</title>
<style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#16210f; color:#fff; font-family:system-ui, Arial, sans-serif; -webkit-user-select:none; user-select:none; }
    #c { position:fixed; left:0; top:0; width:100%; height:100%; display:block; touch-action:none; }
    button { font-family:inherit; cursor:pointer; }

    #top { position:fixed; left:0; right:0; top:0; display:flex; flex-wrap:wrap; gap:6px; padding:6px; pointer-events:none; z-index:5; }
    .chip { pointer-events:auto; background:rgba(20,28,14,.82); border:2px solid #3b4a2a; border-radius:18px; padding:3px 10px 3px 6px; font-size:14px; font-weight:bold; display:flex; align-items:center; gap:6px; text-shadow:1px 1px 0 #000; }
    .dot { width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid rgba(0,0,0,.45); }
    .dot.food { background:#ff9800; } .dot.water { background:#29b6f6; } .dot.scrap { background:#b0bec5; } .dot.bld { background:#a1887f; border-radius:3px; } .dot.cup { background:#ffd54f; border-radius:3px; }
    #who { margin-left:auto; color:#c5e1a5; }
    #badge { display:none; background:#e53935; border-radius:9px; padding:0 6px; font-size:11px; margin-left:4px; }
    #chat-body { height:46vh; }
    .cmsg { padding:3px 0; font-size:13px; word-wrap:break-word; }
    .cmsg b { color:#ffcc80; } .cmsg i { color:#78909c; font-style:normal; font-size:11px; }
    #next { font-size:12px; color:#ffcc80; width:100%; text-shadow:1px 1px 0 #000; pointer-events:none; }

    /* barra de baixo: Loja e Atacar no canto */
    #bar { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end; padding:8px; z-index:5; pointer-events:none; }
    #bar .grp { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; align-items:flex-end; }
    .btn { background:linear-gradient(#66bb6a,#2e7d32); color:#fff; border:2px solid #1b5e20; border-radius:10px; padding:10px 14px; font-size:14px; font-weight:bold; text-shadow:1px 1px 0 #1b5e20; box-shadow:0 3px 0 #1b3d1c; }
    .btn.alt { background:linear-gradient(#78909c,#455a64); border-color:#263238; box-shadow:0 3px 0 #1c262b; text-shadow:1px 1px 0 #263238; }
    .btn.red { background:linear-gradient(#ef5350,#b71c1c); border-color:#7f0000; box-shadow:0 3px 0 #5a0000; text-shadow:1px 1px 0 #7f0000; }
    .btn.gold { background:linear-gradient(#ffca28,#f57f17); border-color:#8d4e00; box-shadow:0 3px 0 #6b3b00; text-shadow:1px 1px 0 #8d4e00; }
    .btn.sm { padding:7px 10px; font-size:13px; }
    .btn:disabled { opacity:.45; filter:grayscale(.6); }
    .ibtn { display:flex; flex-direction:column; align-items:center; gap:1px; width:78px; padding:7px 4px 6px; font-size:13px; }
    .ibtn svg { width:30px; height:30px; }
    #zoom { position:fixed; right:8px; top:46%; display:flex; flex-direction:column; gap:8px; z-index:5; }
    #zoom .btn { width:44px; padding:8px 0; font-size:20px; }

    #sel, #place { position:fixed; left:50%; transform:translateX(-50%); bottom:96px; width:94%; max-width:460px; background:rgba(22,30,16,.94); border:2px solid #4caf50; border-radius:12px; padding:10px 12px; z-index:6; display:none; font-size:14px; box-sizing:border-box; }
    #place { border-color:#ffb300; text-align:center; width:auto; max-width:94%; }
    #sel h3 { margin:0 0 4px; font-size:16px; color:#c5e1a5; }
    #sel .info { color:#dcedc8; margin:3px 0; }
    .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    #place .acts { justify-content:center; }
    .need { color:#ff8a80; }

    #wave { position:fixed; left:50%; transform:translateX(-50%); top:64px; background:rgba(120,10,10,.9); border:2px solid #ff5252; border-radius:12px; padding:6px 14px; z-index:6; display:none; font-weight:bold; text-align:center; }

    /* batalha */
    #bhud { position:fixed; left:0; right:0; top:0; display:none; justify-content:space-between; align-items:center; padding:8px; z-index:7; pointer-events:none; gap:8px; flex-wrap:wrap; }
    #bhud .box2 { pointer-events:auto; background:rgba(20,28,14,.88); border:2px solid #b71c1c; border-radius:12px; padding:6px 12px; font-weight:bold; text-shadow:1px 1px 0 #000; font-size:14px; }
    #bhud .btns { pointer-events:auto; display:flex; gap:6px; }
    #troops { position:fixed; left:0; right:0; bottom:0; display:none; justify-content:center; gap:8px; padding:8px; z-index:7; flex-wrap:wrap; }
    .tcard { background:rgba(22,30,16,.92); border:3px solid #3b4a2a; border-radius:10px; width:84px; padding:6px 4px; text-align:center; font-size:12px; font-weight:bold; cursor:pointer; }
    .tcard.sel { border-color:#ffd54f; background:rgba(60,50,10,.95); }
    .tcard.empty { opacity:.4; }
    .tcard canvas { width:44px; height:44px; display:block; margin:0 auto 2px; }

    .modal { position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.72); z-index:20; display:none; align-items:center; justify-content:center; }
    .modal.show { display:flex; }
    .box { background:#1d2a14; border:2px solid #4caf50; border-radius:12px; width:94%; max-width:520px; max-height:86%; display:flex; flex-direction:column; }
    .box h2 { margin:0; padding:10px 14px; font-size:18px; background:#2c4020; border-radius:10px 10px 0 0; color:#c5e1a5; display:flex; justify-content:space-between; align-items:center; }
    .box .body { padding:10px 14px; overflow-y:auto; }
    .item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #35502a; }
    .item .t { flex:1; } .item b { color:#fff; } .item small { display:block; color:#aab99a; }
    .logline { padding:4px 0; border-bottom:1px solid #2d4222; font-size:13px; color:#dcedc8; }
    .bar2 { height:12px; background:#0f170a; border-radius:6px; overflow:hidden; margin:4px 0 8px; }
    .bar2 i { display:block; height:100%; background:#66bb6a; }
    #start .box { max-width:380px; text-align:center; padding:20px; }
    #start input { width:85%; padding:10px; margin:12px 0; font-size:16px; text-align:center; background:#2b3a20; color:#fff; border:2px solid #4caf50; border-radius:8px; }
    #toast { position:fixed; left:50%; top:96px; transform:translateX(-50%); background:rgba(0,0,0,.88); padding:8px 14px; border-radius:8px; font-size:13px; z-index:30; display:none; max-width:90%; text-align:center; }
    .stars { font-size:34px; color:#ffd54f; letter-spacing:6px; text-align:center; margin:6px 0; }
    .stars span.off { color:#4a4a3a; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="top">
    <div class="chip"><i class="dot food"></i><span id="r-food">0</span></div>
    <div class="chip"><i class="dot water"></i><span id="r-water">0</span></div>
    <div class="chip"><i class="dot scrap"></i><span id="r-scrap">0</span></div>
    <div class="chip"><i class="dot bld"></i><span id="r-bld">0/0</span></div>
    <div class="chip"><i class="dot cup"></i><span id="r-cup">0</span></div>
    <div class="chip" id="who">-</div>
    <div id="next"></div>
</div>

<div id="wave"><span id="wave-txt">Ataque!</span> <button class="btn sm alt" onclick="toggleSpeed()" id="speed-btn">Rápido</button></div>

<div id="bhud">
    <div class="box2" id="b-info">-</div>
    <div class="box2" id="b-stat">-</div>
    <div class="btns" id="b-btns"></div>
</div>
<div id="troops"></div>

<div id="zoom">
    <button class="btn alt" onclick="zoomBtn(1)">+</button>
    <button class="btn alt" onclick="zoomBtn(-1)">&minus;</button>
</div>

<div id="sel"></div>
<div id="place"><div id="place-txt"></div><div class="acts"><button class="btn sm" id="place-ok" onclick="confirmPlace()">Construir</button><button class="btn sm red" onclick="cancelPlace()">Cancelar</button></div></div>

<div id="bar">
    <div class="grp">
        <button class="btn gold ibtn" onclick="openShop()">
            <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h4l3.2 14h14L27 9H8"/><circle cx="12" cy="25.5" r="2" fill="#fff"/><circle cx="22.5" cy="25.5" r="2" fill="#fff"/></svg>
            Loja</button>
        <button class="btn red ibtn" onclick="openAttack()">
            <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l15 15M27 5L12 20M5 5l5 1M5 5l1 5M27 5l-5 1M27 5l-1 5"/><path d="M18 22l5 5M14 22l-5 5" stroke-width="3.4"/></svg>
            Atacar</button>
    </div>
    <div class="grp">
        <button class="btn alt sm" onclick="openArmy()">Exército</button>
        <button class="btn alt sm" onclick="collectAll()">Coletar tudo</button>
        <button class="btn alt sm" onclick="openLog()">Diário</button>
        <button class="btn alt sm" onclick="openChat()">Chat<span id="badge"></span></button>
    </div>
</div>

<div class="modal" id="shop"><div class="box"><h2>Loja <button class="btn sm red" onclick="closeModals()">X</button></h2><div class="body" id="shop-body"></div></div></div>
<div class="modal" id="log"><div class="box"><h2>Diário da aldeia <button class="btn sm red" onclick="closeModals()">X</button></h2><div class="body" id="log-body"></div></div></div>
<div class="modal" id="army"><div class="box"><h2>Exército <button class="btn sm red" onclick="closeModals()">X</button></h2><div class="body" id="army-body"></div></div></div>
<div class="modal" id="atk"><div class="box"><h2>Atacar <button class="btn sm red" onclick="closeModals()">X</button></h2><div class="body" id="atk-body"></div></div></div>
<div class="modal" id="chat"><div class="box"><h2>Chat <button class="btn sm red" onclick="closeModals()">X</button></h2><div class="body" id="chat-body"></div>
    <div style="display:flex;gap:6px;padding:8px"><input id="chat-in" maxlength="140" placeholder="Mensagem..." style="flex:1;padding:9px;background:#2b3a20;color:#fff;border:2px solid #4caf50;border-radius:8px;min-width:0"><button class="btn sm" onclick="sendChat()">Enviar</button></div></div></div>
<div class="modal" id="result"><div class="box"><h2>Resultado do ataque</h2><div class="body" id="result-body"></div></div></div>
<div class="modal show" id="start"><div class="box"><h2>Z-BRASIL: ALDEIA</h2>
    <div style="margin-top:10px;color:#c5e1a5;">Construa sua aldeia, treine zumbis e ataque outras bases. Os bots atacam a sua a cada 90 minutos.</div>
    <input id="name-in" maxlength="15" placeholder="Seu nome de sobrevivente">
    <button class="btn" onclick="newGame()">Começar</button>
</div></div>
<div id="toast"></div>

<script>
// =====================================================
//  CONFIGURAÇÃO
// =====================================================
// Abrindo o jogo pelo servidor (http://IP:3000 ou o endereço da hospedagem) ele conecta sozinho.
// Se o jogo estiver em outro lugar, escreva aqui o endereço do servidor.
var SERVER_URL_MANUAL = "";
var SERVER_URL = SERVER_URL_MANUAL || ((location.protocol === "http:" || location.protocol === "https:") ? location.origin : "");

var GRID = 30, LT = 48, LTT = 32;
var SAVE_KEY = "zbrasil_aldeia2";
var BOT_EVERY = 90 * 60 * 1000;   // os bots atacam a cada 90 minutos
var TRIG = 6;                     // o bunker abre quando um inimigo chega a esta distância
var BAD = ["pau","pinto","bunda","vagina","penis","buceta","caralho","droga","maconha","cocaina","crack","lança","arma","fuzil","pistola","oitão","assassinar","matar","biqueira","trafico"];

var DEF = {
    center: { name: "Centro da Aldeia", size: 3, maxLvl: 4, res: "scrap", idx: 0,
        hp: [400, 700, 1100, 1600], rate: [60, 120, 220, 400], cap: [120, 300, 600, 1000],
        cost: [null, { scrap: 300, food: 150, water: 150 }, { scrap: 800, food: 400, water: 400 }, { scrap: 2000, food: 1000, water: 1000 }],
        time: [0, 120, 600, 1800], desc: "O começo de tudo. Junta sucata e libera mais construções." },
    tower: { name: "Torre de Guarda", size: 2, maxLvl: 3, idx: 1,
        hp: [140, 220, 340], dmg: [7, 11, 17], cd: [0.8, 0.75, 0.7], range: [6.5, 7, 7.5],
        cost: [{ scrap: 80, food: 40 }, { scrap: 200, food: 100 }, { scrap: 450, food: 220 }], time: [25, 90, 240], limit: [2, 3, 5, 7],
        desc: "Atira nos zumbis inimigos que chegam perto." },
    wall: { name: "Muro", size: 1, maxLvl: 3, idx: 2,
        hp: [90, 180, 320], cost: [{ scrap: 8 }, { scrap: 30, water: 10 }, { scrap: 80, water: 30 }], time: [0, 8, 20], limit: [25, 50, 80, 120],
        desc: "Segura os zumbis longe. Arraste o dedo para fazer uma fileira." },
    market: { name: "Mercado", size: 2, maxLvl: 3, res: "food", idx: 3,
        hp: [80, 130, 200], rate: [100, 200, 360], cap: [150, 300, 600],
        cost: [{ scrap: 50, water: 30 }, { scrap: 150, water: 90 }, { scrap: 350, water: 200 }], time: [20, 80, 200], limit: [1, 2, 2, 3],
        desc: "Produz alimentos. Toque nele para coletar." },
    well: { name: "Poço", size: 2, maxLvl: 3, res: "water", idx: 4,
        hp: [80, 130, 200], rate: [100, 200, 360], cap: [150, 300, 600],
        cost: [{ scrap: 50, food: 30 }, { scrap: 150, food: 90 }, { scrap: 350, food: 200 }], time: [20, 80, 200], limit: [1, 2, 2, 3],
        desc: "Dá água para a aldeia. Toque nele para coletar." },
    hut: { name: "Cabana do Construtor", size: 2, maxLvl: 1, idx: 5,
        hp: [90], cost: [{ scrap: 150, food: 80, water: 80 }], time: [45], limit: [1, 2, 2, 3],
        desc: "Cada cabana é um construtor: constrói e melhora coisas ao mesmo tempo." },
    cemetery: { name: "Cemitério", size: 2, maxLvl: 3, idx: 6,
        hp: [120, 200, 300], cost: [{ scrap: 120, food: 60, water: 60 }, { scrap: 300, food: 150, water: 150 }, { scrap: 700, food: 350, water: 350 }], time: [40, 120, 300], limit: [1, 1, 2, 2],
        desc: "Aqui nascem os zumbis do seu exército. Nível 2 libera o Cuspidor, nível 3 o Escudeiro." },
    bunker: { name: "Bunker", size: 3, maxLvl: 3, idx: 7,
        hp: [250, 380, 560], cap: [20, 35, 50], cost: [{ scrap: 150, food: 80, water: 80 }, { scrap: 400, food: 200, water: 200 }, { scrap: 900, food: 450, water: 450 }], time: [60, 150, 360], limit: [1, 2, 2, 3],
        desc: "O acampamento dos zumbis. Quando inimigos chegam perto, o bunker abre e os zumbis saem para defender." }
};
var TYPES = ["center", "tower", "wall", "market", "well", "hut", "cemetery", "bunker"];
var STORE_CAP = [600, 1500, 3500, 8000];
var SHOP_ORDER = ["tower", "wall", "market", "well", "cemetery", "bunker", "hut"];
var RESN = { food: "comida", water: "água", scrap: "sucata" };

var TROOP = {
    zombie: { name: "Zumbi", space: 1, hp: 45, dmg: 8, sp: 1.1, range: 0.7, cost: { food: 10, water: 5 }, time: 8, unlock: 1, col: "#7cb342", desc: "O zumbi inicial. Ataca de perto." },
    spitter: { name: "Zumbi Cuspidor", space: 2, hp: 28, dmg: 9, sp: 1.0, range: 3.5, cost: { food: 25, water: 15 }, time: 18, unlock: 2, col: "#9ccc65", desc: "Cospe uma bola verde brilhante de longe, como uma arqueira." },
    tank: { name: "Zumbi Escudeiro", space: 5, hp: 220, dmg: 6, sp: 0.9, range: 0.7, cost: { food: 60, water: 40 }, time: 45, unlock: 3, col: "#558b2f", desc: "Segura uma porta de ferro e fica na frente, protegendo as tropas." }
};
var TROOP_ORDER = ["zombie", "spitter", "tank"];

// =====================================================
//  ESTADO
// =====================================================
var S = null;            // dados salvos
var V = [];              // aldeia que está na tela (a sua ou a do inimigo)
var occ = [];
var sel = null, placing = null;
var BT = null;           // batalha em andamento
var SC = null;           // olhando a base do inimigo antes de atacar
var $ = function (id) { return document.getElementById(id); };
function now() { return Date.now(); }
function fmtT(sec) {
    sec = Math.max(0, Math.ceil(sec));
    if (sec >= 3600) return Math.floor(sec / 3600) + "h " + Math.floor((sec % 3600) / 60) + "min";
    if (sec >= 60) return Math.floor(sec / 60) + "min " + (sec % 60) + "s";
    return sec + "s";
}
function toast(t) { var e = $('toast'); e.innerText = t; e.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { e.style.display = 'none'; }, 3200); }
function logAdd(t) { S.log.push({ t: now(), text: t }); if (S.log.length > 60) S.log.shift(); }
function newId() { var s = ""; while (s.length < 14) s += Math.floor(Math.random() * 16).toString(16); return s; }
function rng(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- regras da aldeia ----------
function maxHp(b) { return DEF[b.type].hp[b.lvl - 1]; }
function centerB() { for (var i = 0; i < S.vil.length; i++) if (S.vil[i].type === "center") return S.vil[i]; return null; }
function cLvl() { return centerB().lvl; }
function limitOf(type) { return DEF[type].limit[cLvl() - 1]; }
function countOf(type) { var n = 0; S.vil.forEach(function (b) { if (b.type === type) n++; }); return n; }
function maxBuildLvl() { return Math.min(3, cLvl()); }
function storeCap() { return STORE_CAP[cLvl() - 1]; }
function building(b) { return b.bEnd > now(); }
function upgrading(b) { return b.uEnd > now(); }
function functional(b) { return !building(b); }
function costOf(type, lvl) {
    var c = DEF[type].cost[lvl - 1];
    if (type === "hut") { var m = Math.max(1, countOf("hut")); return { scrap: c.scrap * m, food: c.food * m, water: c.water * m }; }
    return c;
}
function canPay(c) { for (var k in c) if (S.res[k] < c[k]) return false; return true; }
function pay(c) { for (var k in c) S.res[k] -= c[k]; }
function costText(c) { var a = []; for (var k in c) a.push(c[k] + " " + RESN[k]); return a.join(", "); }
function builders() { var n = 0; S.vil.forEach(function (b) { if (b.type === "hut" && functional(b)) n++; }); return n; }
function busy() { var n = 0; S.vil.forEach(function (b) { if (building(b) || upgrading(b)) n++; }); return n; }
function stored(b) {
    var d = DEF[b.type];
    if (!d.rate || !functional(b)) return 0;
    return Math.min(d.cap[b.lvl - 1], d.rate[b.lvl - 1] * (now() - b.last) / 3600000);
}
function bAt(x, y) { return (x < 0 || y < 0 || x >= GRID || y >= GRID) ? null : occ[y * GRID + x]; }
function buildOcc() {
    occ = new Array(GRID * GRID);
    V.forEach(function (b) {
        if (b.dead || b.hp <= 0 || b.moving) return;
        var s = DEF[b.type].size;
        for (var j = 0; j < s; j++) for (var i = 0; i < s; i++) occ[(b.y + j) * GRID + b.x + i] = b;
    });
    vsDirty = true;
}
function useVillage(arr) { V = arr; buildOcc(); staticDirty = true; }
function freeSpot(type, x, y) {
    var s = DEF[type].size;
    if (x < 1 || y < 1 || x + s > GRID - 1 || y + s > GRID - 1) return false;
    for (var j = 0; j < s; j++) for (var i = 0; i < s; i++) if (occ[(y + j) * GRID + x + i]) return false;
    return true;
}

// ---------- exército: bunker guarda, cemitério treina ----------
function cemeteries() { return S.vil.filter(function (b) { return b.type === "cemetery" && functional(b); }); }
function cemLvl() { var m = 0; cemeteries().forEach(function (b) { m = Math.max(m, b.lvl); }); return m; }
function houseCap() { var n = 0; S.vil.forEach(function (b) { if (b.type === "bunker" && functional(b)) n += DEF.bunker.cap[b.lvl - 1]; }); return n; }
function houseUsed() { var n = 0; TROOP_ORDER.forEach(function (k) { n += S.troops[k] * TROOP[k].space; }); return n; }
function queueSpace() { var n = 0; S.queue.forEach(function (k) { n += TROOP[k].space; }); return n; }
function armyCount() { var n = 0; TROOP_ORDER.forEach(function (k) { n += S.troops[k]; }); return n; }
function trainTroop(type) {
    var T = TROOP[type];
    if (cemLvl() < T.unlock) { toast("Precisa de um Cemitério nível " + T.unlock + "."); return; }
    if (houseUsed() + queueSpace() + T.space > houseCap()) { toast("Sem espaço nos bunkers. Construa ou melhore um Bunker."); return; }
    if (!canPay(T.cost)) { toast("Faltam recursos."); return; }
    pay(T.cost);
    if (!S.queue.length) S.trainAt = now();
    S.queue.push(type);
    updateTop(); openArmy(true); save();
}
function cancelTrain(i) {
    var type = S.queue[i]; if (!type) return;
    var c = TROOP[type].cost; for (var k in c) S.res[k] = Math.min(storeCap(), S.res[k] + c[k]);
    S.queue.splice(i, 1); if (!S.queue.length) S.trainAt = now();
    updateTop(); openArmy(true);
}
function processTraining(visual) {
    var n = cemeteries().length;
    if (!n || !S.queue.length) return;
    var el = now() - S.trainAt;
    while (S.queue.length) {
        var type = S.queue[0], need = TROOP[type].time * 1000 / n;
        if (el < need) break;
        if (houseUsed() + TROOP[type].space > houseCap()) return; // bunker cheio: espera
        S.troops[type]++; S.queue.shift(); el -= need; S.trainAt += need;
        if (visual) spawnWalker(type);
    }
}

// =====================================================
//  SALVAR / CARREGAR / COMEÇAR

    for (i = 0; i < B.bunkers.length; i++) {

        var open = k.b.hp < maxHp(k.b), c = bCenter(k.b);
        if (!open) for (j = 0; j < us.length; j++) { var u0 = us[j]; if (!u0.dead && u0.side === 'a' && Math.hypot(u0.x - c.x, u0.y - c.y) <= TRIG) { open = true; break; } }
        if (open) openBunker(k);
    }
    var dd = DEF.tower;
    for (i = 0; i < B.towers.length; i++) {
        var tw = B.towers[i];
        if (tw.dead) continue;
        tw.cd -= dt;
        if (tw.cd > 0) continue;
        var l = tw.lvl - 1, tx = tw.x + 1, ty = tw.y + 1, r2 = dd.range[l] * dd.range[l], best = null, bdist = r2, tankB = null, tdist = r2;
        for (j = 0; j < us.length; j++) {
            var z = us[j]; if (z.dead || z.side !== 'a') continue;
            var d2 = (z.x - tx) * (z.x - tx) + (z.y - ty) * (z.y - ty);
            if (d2 <= bdist) { bdist = d2; best = z; }
            if (z.type === 'tank' && d2 <= tdist) { tdist = d2; tankB = z; }
        }
        best = tankB || best; // o escudeiro chama a atenção das torres
        if (best) {
            best.hp -= dd.dmg[l]; tw.cd = dd.cd[l];
            B.projs.push({ x1: tx, y1: ty, x2: best.x, y2: best.y, t: 0.12, max: 0.12 });
            if (best.hp <= 0) { best.dead = true; B.killedA++; }

    }
    us = B.us; // (a lista pode ter crescido com o bunker)
    for (i = 0; i < us.length; i++) if (!us[i].dead) uStep(us[i], dt);
    // afasta zumbis que ficaram em cima uns dos outros
    for (i = 0; i < us.length; i++) {
        var a = us[i]; if (a.dead) continue;
        for (j = i + 1; j < us.length; j++) {
            var b = us[j]; if (b.dead) continue;
            var ex = b.x - a.x, ey = b.y - a.y, e2 = ex * ex + ey * ey;

                var e = Math.sqrt(e2), push = (0.3 - e) * 0.25, px = ex / e * push, py = ey / e * push;
                if (!bAt(Math.floor(b.x + px), Math.floor(b.y + py))) { b.x += px; b.y += py; }
                if (!bAt(Math.floor(a.x - px), Math.floor(a.y - py))) { a.x -= px; a.y -= py; }

    for (i = 0; i < us.length; i++) { if (!us[i].dead) { us[w++] = us[i]; if (us[i].side === 'a') alive++; } }
    us.length = w;
    w = 0; for (i = 0; i < B.projs.length; i++) { B.projs[i].t -= dt; if (B.projs[i].t > 0) B.projs[w++] = B.projs[i]; }
    B.projs.length = w;
    var left = B.army ? B.army.zombie + B.army.spitter + B.army.tank : 0;
    if (B.centerDown && B.kind === 'defend') B.over = true;
    else if (B.destroyedN >= B.nonWall.length) B.over = true;
    else if (B.t > B.limit) B.over = true;

}

function apiPost(path, body) {

        var done = false, t = setTimeout(function () { if (!done) { done = true; reject(new Error("timeout")); } }, 9000);
        fetch(SERVER_URL + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
            .then(function (r) { return r.json(); })
            .then(function (j) { if (!done) { done = true; clearTimeout(t); resolve(j); } })
            .catch(function (e) { if (!done) { done = true; clearTimeout(t); reject(e); } });
    });
}

            var lt = []; for (var q in e.loot) if (e.loot[q] > 0) lt.push(e.loot[q] + " " + RESN[q]);
            S.log.push({ t: e.t, text: e.by + " atacou a sua base" + off + "! " + e.destr + "% destruído, " + e.stars + " estrela" + (e.stars === 1 ? "" : "s") + ". " + (lt.length ? "Levou " + lt.join(", ") + "." : "Não levou nada.") });

        if (chatOpen) renderChat();
        var b = $('badge'); b.style.display = chatUnread > 0 ? 'inline' : 'none'; b.innerText = chatUnread > 9 ? "9+" : chatUnread;
    }).catch(function () { /* sem conexão */ });
}
function renderChat() {
    var box = $('chat-body'), h = "";
    if (!SERVER_URL) h = "<div class='need'>O chat precisa do servidor. Abra o jogo pelo endereço do servidor.</div>";
    chatMsgs.forEach(function (m) {
        var d = new Date(m.t), hh = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
        h += "<div class='cmsg'><i>" + hh + "</i> <b>" + m.n.replace(/</g, "&lt;") + ":</b> " + m.text.replace(/</g, "&lt;") + "</div>";
    });
    box.innerHTML = h || "<div class='cmsg'>Ninguém falou ainda. Seja o primeiro!</div>";
    box.scrollTop = box.scrollHeight;
}
function openChat() {
    if (BT || SC) return;
    cancelPlace(); closeModals();
    chatOpen = true; chatUnread = 0; $('badge').style.display = 'none';
    $('chat').classList.add('show'); renderChat(); pollChat();
}
function sendChat() {
    var inp = $('chat-in'), text = inp.value.trim();
    if (!text) return;
    if (!SERVER_URL) { toast("O chat precisa do servidor."); return; }
    inp.value = "";
    apiPost("/api/chat/send", { id: S.id, text: text }).then(function (r) { if (r && r.ok) pollChat(); else toast((r && r.msg) || "Não foi possível enviar."); }).catch(function () { toast("Sem conexão com o servidor."); });
}
$('chat-in').addEventListener('keydown', function (e) { if (e.keyCode === 13) sendChat(); });

function startGame() {
    resize();
    ts = Math.max(18, Math.min(46, Math.round(vw / 17)));
    useVillage(S.vil); catchUp();
    centerOn(centerB());
    staticDirty = true; showMainUI(true); updateTop(); requestRender(); save();
    syncNow();
    if (!startGame.started) {
        startGame.started = true;
        setInterval(tick, 1000);
        setInterval(save, 3000);
        setInterval(syncNow, 25000);
        setInterval(function () { if (chatOpen) pollChat(); }, 3000);
        setInterval(pollChat, 20000);
        pollChat();
        window.addEventListener('beforeunload', function () { save(true); });
        window.addEventListener('resize', resize);
        document.addEventListener('visibilitychange', function () { if (document.hidden) save(true); else { tick(); requestRender(); } });
    }
}
window.onload = function () { if (load()) { $('start').classList.remove('show'); startGame(); } };
</script>
</body>
</html>
